<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>POS – Inventory System</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="overlay hidden">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-glow-container">
                    <img src="nuricon_POS_web.png" alt="Logo" style="width:100px; height:auto;">
                </div>
                <h2 data-i18n="login_title">Inventory Portal</h2>
                <p style="color:var(--text-muted); font-size:0.9rem;" data-i18n="login_subtitle">Sign in to manage your garage</p>
            </div>
            <div id="loginError" class="error-box hidden"></div>
            <div class="input-group">
                <label data-i18n="login_username">Username</label>
                <input type="text" id="loginUser" placeholder="admin" autocomplete="username">
            </div>
            <div class="input-group">
                <label data-i18n="login_password">Password</label>
                <div class="password-wrapper" style="position:relative;">
                    <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
                    <div class="password-toggle" id="togglePassword">
                        <svg id="eyeOpen" class="hidden" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg id="eyeClosed" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </div>
                </div>
            </div>
            <button class="btn-primary-large" id="btnLogin" data-i18n="login_btn">Sign In</button>
        </div>
    </div>

    <!-- MAIN POS CONTAINER -->
    <div class="pos-container">
        <!-- HEADER -->
        <header class="top-nav">
            <div class="brand">
                <div class="logo"></div>
            </div>
            <div class="top-actions" style="flex: 1; justify-content: flex-end; flex-wrap: nowrap; overflow: hidden;">
                <div class="search-bar">
                    <div class="search-icon-wrapper">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </div>
                    <input type="text" id="searchInput" placeholder="Search inventory...">
                    <button class="btn-camera-scan" id="btnCameraScan" title="Scan Barcode">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                    </button>
                </div>
                <button class="btn-icon-top" id="btnFullscreen" title="Toggle Fullscreen">
                    <svg id="fsIconEnter" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                    <svg id="fsIconExit" class="hidden" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path></svg>
                </button>
                <button class="btn-icon-top" id="btnOpenAddModal" title="Add Product">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                </button>
                <div class="notification-bell" id="btnNotifications">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    <span class="bell-badge hidden" id="outOfStockBadge">0</span>
                </div>
                <button class="btn-icon-top" id="btnOpenReturns" title="Return Items">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M1 4v6h6"></path><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
                </button>
                <button class="btn-icon-top" id="btnLock" title="Lock Screen">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </button>
                <button class="btn-icon-top" id="btnLogout" style="color:var(--danger);">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </button>
            </div>
        </header>

        <!-- LOCK SCREEN OVERLAY -->
        <div id="lockScreen" class="overlay hidden" style="z-index: 5000;">
            <div class="login-card">
                <div class="login-header">
                    <div class="logo-glow-container">
                        <svg viewBox="0 0 24 24" width="60" height="60" stroke="var(--accent)" stroke-width="2" fill="none" style="margin-bottom:15px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </div>
                    <h2 id="lockUserDisplay">Session Locked</h2>
                    <p style="color:var(--text-muted); font-size:0.9rem;" data-i18n="lock_subtitle">Enter password to resume</p>
                </div>
                <div class="input-group">
                <label data-i18n="login_password">Password</label>
                    <input type="password" id="lockPass" placeholder="••••••••">
                </div>
                <button class="btn-primary-large" id="btnUnlock" data-i18n="lock_unlock">Unlock</button>
                <button class="btn-clear" id="btnLockLogout" style="margin-top:20px; width:100%; height:40px;" data-i18n="lock_switch">Switch User / Logout</button>
            </div>
        </div>

        <!-- PRODUCT AREA -->
        <main class="products-area">
            <nav class="categories" id="categoryList">
                <button class="cat-btn active" data-category="All">All Parts</button>
            </nav>
            <div class="product-grid" id="productGrid"></div>
        </main>

        <!-- SIDEBAR -->
        <aside class="cart-sidebar">
            <div class="cart-header">
                <div style="display:flex; flex-direction:column; gap:6px;">
                    <h2 data-i18n="order_title">Order</h2>
                    <div id="scannerStatus" class="scanner-status-mini pulse">
                        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" style="margin-right:6px;vertical-align:middle;">
                            <path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                            <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                            <line x1="7" y1="12" x2="17" y2="12"></line>
                        </svg>
                        Scanner Ready
                    </div>
                </div>
                <button class="btn-clear" id="btnClearCart" data-i18n="cart_clear">Clear</button>
            </div>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-footer">
                <div class="summary-line" style="margin-bottom:20px;">
                    <span style="font-size:0.75rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px;" data-i18n="cart_currency">Display Currency</span>
                    <select id="currencySelect" class="currency-select" style="width:120px;">
                        <option value="USD">USD ($)</option>
                    </select>
                </div>
                <div class="summary-line">
                    <span data-i18n="cart_subtotal">Subtotal</span>
                    <span id="subTotal">$0.00</span>
                </div>
                <div class="summary-line" style="display:flex; align-items:center;">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span data-i18n="cart_tax">Tax (10%)</span>
                        <input type="checkbox" id="applyTax" style="width:18px;height:18px;">
                    </div>
                    <span id="taxTotal">$0.00</span>
                </div>
                <div class="summary-line total">
                    <span data-i18n="cart_total">Total</span>
                    <span id="grandTotal">$0.00</span>
                </div>
                <button class="btn-checkout" id="btnCheckout" data-i18n="cart_checkout">Process Checkout</button>
            </div>
        </aside>

        <!-- FOOTER -->
        <footer class="tablet-footer">
            &copy; 2026 Softio Digital Transformation Services. All rights reserved.
        </footer>
    </div>

    <!-- ADD ITEM MODAL -->
    <div id="addItemModal" class="overlay hidden">
        <div class="scanner-card">
            <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
                <h2 style="margin:0;" id="modalTitle">Add New Product</h2>
                <button id="btnCloseAddModal" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            <input type="hidden" id="editItemId">
            <div class="input-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:15px; text-align:left;">
                <div class="input-group">
                    <label data-i18n="modal_field_name">Product Name</label>
                    <input type="text" id="newItemName" placeholder="e.g. Brake Pads">
                </div>
                <div class="input-group">
                    <label data-i18n="modal_field_category">Category</label>
                    <select id="newItemCategory">
                        <!-- Options populated dynamically from database -->
                    </select>
                </div>
                <div class="input-group">
                    <label data-i18n="modal_field_price">Price ($)</label>
                    <input type="number" id="newItemPrice" placeholder="0.00">
                </div>
                <div class="input-group">
                    <label data-i18n="modal_field_stock">Initial Stock</label>
                    <input type="number" id="newItemStock" placeholder="0">
                </div>
                <div class="input-group" style="grid-column: span 2;">
                    <label data-i18n="modal_field_barcode">Barcode / SKU</label>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="newItemBarcode" placeholder="Scan or type barcode" style="flex:1;">
                        <button class="btn-camera-scan" id="btnModalCameraScan" style="width:55px;">
                            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                        </button>
                    </div>
                </div>
            </div>
            <button class="btn-primary-large" id="btnSubmitItem">Add Product</button>
        </div>
    </div>

    <!-- CAMERA SCANNER MODAL -->
    <div id="cameraScannerModal" class="overlay hidden">
        <div class="scanner-card">
            <div id="reader"></div>
            <div style="display:flex; justify-content:center; gap:20px; margin-top:25px;">
                <button class="btn-primary-large" id="btnSwitchCamera" style="margin:0; width:auto; padding:15px 30px;">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" style="margin-right:8px;vertical-align:middle;"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                    Flip Camera
                </button>
                <button class="btn-close" id="btnCloseScanner">&times;</button>
            </div>
        </div>
    </div>

    <!-- RETURNS MODAL -->
    <div id="returnsModal" class="overlay hidden">
        <div class="scanner-card" style="max-width:500px;">
            <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
                <h2 style="margin:0;" data-i18n="returns_title">Order Returns</h2>
                <button id="btnCloseReturnsModal" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            
            <div id="returnsOrderList" class="returns-list">
                <!-- Orders populated here -->
            </div>

            <div id="returnsItemSelection" class="hidden">
                <div id="returnItemsList" style="text-align:left; margin-bottom:20px;"></div>
                <div class="input-group">
                    <label data-i18n="returns_reason_label">Reason for Return</label>
                    <input type="text" id="returnReason" placeholder="e.g. Defective item">
                </div>
                <div style="display:flex; gap:10px;">
                    <button class="btn-clear" onclick="backToOrderList()" style="flex:1;" data-i18n="returns_back">Back</button>
                    <button class="btn-primary-large" id="btnProcessReturn" style="flex:2; margin-top:0;" data-i18n="returns_process">Process Refund</button>
                </div>
            </div>
        </div>
    </div>

    <!-- NOTIFICATION PORTAL (Outside any stacking context) -->
    <div class="notification-panel hidden" id="notificationPanel">
        <div class="notif-header" data-i18n="notif_header">System Alerts</div>
        <div class="notif-list" id="notificationList"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/6.0.1/signalr.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="app.js"></script>
</body>
</html>
